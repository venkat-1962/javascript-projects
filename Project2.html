    let container=document.querySelector('.game-div');
    let inputBox=document.querySelector('#input-box');
    let submit=document.querySelector('#submit');
    let input=document.querySelector('.input-div')
    let result=words[Math.floor(Math.random()*600)];
    let message=document.querySelector('#message');
    for(let i=1;i<7;i++){
        let newContainer=document.createElement('div');
        newContainer.classList.add(`container${i}`);
        newContainer.style.display= "flex";
        for(let j=0;j<5;j++){
            let newbox=document.createElement('div');
            newbox.classList.add(`box${i}`);
            newContainer.appendChild(newbox);
        }
        container.insertBefore(newContainer, input);
    }
    let attempt=0;
    submit.addEventListener('click',()=>{
        attempt++;
        addLetters(inputBox.value);
        inputBox.value='';
    });
    function addLetters(text){
        let boxes=Array.from(document.querySelectorAll(`.box${attempt}`));
        let guessedLetters=Array.from(text);
        let actualLetters=Array.from(result);
        let i=0;
        let correctLetters=0;
        boxes.forEach(box =>{
            box.textContent=`${guessedLetters[i].toUpperCase()}`;
            if(guessedLetters[i]===actualLetters[i]){
                correctLetters++;
                box.style.color= 'white';
                box.style.backgroundColor= 'green';
            }
            else if(actualLetters.includes(guessedLetters[i])){
                box.style.color= 'black'
                box.style.backgroundColor= 'yellow';
            }
            else{
                box.style.color= 'white'
                box.style.backgroundColor= 'grey';
            }
            if(correctLetters==5){
                message.textContent= "Congratulations! You guessed the word. To play again refresh the page";
                submit.removeEventListener();
            }
            i++;
        })
        if(attempt==6 &&correctLetters!=5){
            container.style.backgroundColor="red";
            message.textContent=` Sorry! You were not able guess the word.
            To play again refresh the page`;
            submit.removeEventListener();
        }
    }
