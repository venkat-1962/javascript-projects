<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battleship Game Layout</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: tomato; /* Vibrant game coral-red background */
      color: snow;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 20px;
      text-decoration: underline;
      text-underline-offset: 6px;
      letter-spacing: 1px;
    }

    .rules-container {
      max-width: 500px;
      width: 100%;
      margin-bottom: 30px;
    }

    .rules-title {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 8px;
    }

    ol {
      margin: 0;
      padding-left: 20px;
      font-size: 15px;
      line-height: 1.5;
    }

    .flex-grid {
      display: flex;
      flex-wrap: wrap;
      width: 400px;
      height: 400px;
      border: 4px solid snow;
      background-color: snow;
      margin-bottom: 40px;
    }

    .grid-cell {
      width: 25%;
      height: 25%;
      box-sizing: border-box;
      border: 2px solid snow; 
      background-color: tomato;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: tomato;
    }

    .img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }
    .ok{
      height: 100px;
      width: 100px;
      background-color: blue;
      color: white;
      border-radius: 25%;
    }

    .reset-btn {
      background-color: white;
      color: #333;
      border: none;
      padding: 12px 45px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0px 5px 0px #c0392b; 
    }
  </style>
</head>
<body>

  <h1>Battleship</h1>

  <div class="rules-container">
    <div class="rules-title">Game Rules</div>
    <ol>
      <li>Click on the cells to reveal the image hidden behind them.</li>
      <li>There are 5 ships hidden in the game.</li>
      <li>You win if you can find all ships in less than 8 clicks, else you lose.</li>
    </ol>
    <dialog class="dialogue">
      <h1></h1>
      <button class="ok" id="ok">OK</button>
    </dialog>
  </div>

  <div class="flex-grid">
    
  </div>

  <button class="reset-btn">Reset</button>

</body>
</html>
<script>
    let container=document.querySelector('.flex-grid');
    let dialogue=document.querySelector('.dialogue');
    for(let i=0;i<16;i++){
        let cell=document.createElement('div');
        cell.classList.add('grid-cell');
        container.appendChild(cell);
    }
    let gridCell=Array.from(document.querySelectorAll('.grid-cell'));
    let i=0;
    while(i<5){
        let ship=document.createElement('img');
        ship.src="https://ik.imagekit.io/d9mvewbju/Course/BigbinaryAcademy/battleship-image_e6bWCZ1w4.png";
        ship.classList.add('img','ship');
        let random=Math.floor(Math.random()*16);
        //console.log(random);
        console.log(gridCell[random].children.length);
        if(gridCell[random].children.length===0){
            gridCell[random].appendChild(ship);
            i++;
        }
    }
    for(i=0;i<16;i++){
        let ocean=document.createElement('img');
        ocean.src="https://ik.imagekit.io/d9mvewbju/Course/BigbinaryAcademy/seamless-pattern-waves-various-shades-blue-vector-underwater-design-96891651_aSd5pmbaM.webp";
        ocean.classList.add("img","ocean");
        if(gridCell[i].children.length===0){
            gridCell[i].appendChild(ocean);
        }
    }
    let shipCount=0;
    let attempt=0;
    function manageGame(event){
      attempt++;
      if(event.target.classList.contains('grid-cell')){
        event.target.firstElementChild.style.display="block";
      }
      if(event.target.firstElementChild.classList.contains('ship')){
        shipCount++;
      }
      console.log(shipCount+""+attempt);
      if(shipCount===5&&attempt!==8){
        dialogue.firstElementChild.style.textContent=="YOU WON";
        dialogue.show();
        container.removeEventListener('click', manageGame);
      }
      else if(attempt===8&&shipCount!==5){
        dialogue.firstElementChild.style.innerText=="YOU LOST";
        dialogue.show();
        container.removeEventListener('click', manageGame);
      }
    }
    container.addEventListener('click',manageGame);
</script>
